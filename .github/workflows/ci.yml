name: CI

on:
  # Branch pushes are covered by the pull_request event; only main needs a post-merge run.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # `ready_for_review` re-runs CI when a draft is marked ready, so the integration step
    # that a draft skipped actually executes before merge.
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Pinned to full commit SHAs: a tag can be moved under us.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repository formatting
        run: ./scripts/format-check.sh

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Pinned to full commit SHAs: a tag can be moved under us.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The frontend module shells out to npm; cache is keyed on its lock file.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: courses-frontend/package-lock.json

      # `check` lints the workflows with actionlint; pin the binary and verify its checksum.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$asset" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$asset"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$asset" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Docker-free on purpose: the integration test is a separate task, so a
      # local `./gradlew build` never needs a running server.
      - name: Build and unit test
        run: ./gradlew build --no-daemon

      # The suites own their infrastructure: Testcontainers starts Axon Server
      # and PostgreSQL per run on random ports and removes them afterwards, so
      # no Compose stack is started here. Images are built locally, and in CI only by the Phase 8 e2e job.
      - name: Integration tests (Axon Server + PostgreSQL)
        # Draft PRs skip the container-backed suites; the build and unit tests still run.
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: ./gradlew integrationTest --no-daemon
