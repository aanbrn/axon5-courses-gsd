name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "gsd/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Pinned to full commit SHAs: a tag can be moved under us.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect Gradle wrapper
        id: detect
        run: |
          if [ -x ./gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No wrapper yet
        if: steps.detect.outputs.present == 'false'
        run: echo "No ./gradlew in this revision — build skipped until the Gradle scaffolding lands."

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.detect.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and test
        if: steps.detect.outputs.present == 'true'
        run: ./gradlew build --no-daemon
