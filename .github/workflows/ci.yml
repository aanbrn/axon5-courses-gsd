name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'gsd/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Pinned to full commit SHAs: a tag can be moved under us.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repository formatting
        run: ./scripts/format-check.sh

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Pinned to full commit SHAs: a tag can be moved under us.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The frontend module shells out to npm; cache is keyed on its lock file.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Compose, not `services:` — one source of truth for the image tags.
      - name: Start infrastructure
        run: docker compose up -d --wait

      # Docker-free on purpose: the integration test is a separate task, so a
      # local `./gradlew build` never needs a running server.
      - name: Build and unit test
        run: ./gradlew build --no-daemon

      - name: Integration tests (Axon Server + PostgreSQL)
        run: ./gradlew integrationTest --no-daemon

      - name: Infrastructure logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop infrastructure
        if: always()
        run: docker compose down -v --remove-orphans
