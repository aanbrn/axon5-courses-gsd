name: Buildpack Updates

# The buildpack and builder pins live in gradle/libs.versions.toml, which Dependabot cannot see:
# they are not Gradle dependencies. This weekly job compares them with the registry and keeps one
# open issue, so the pins cannot quietly fall behind. Bumping them is still a human step, because a
# new buildpack or builder must be proven by an image build.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: buildpack-updates
  cancel-in-progress: false

jobs:
  buildpack-updates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Pinned to full commit SHAs: a tag can be moved under us.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare catalog pins with Docker Hub
        id: report
        shell: bash
        run: |
          set -euo pipefail

          catalog="gradle/libs.versions.toml"
          body="$RUNNER_TEMP/buildpack-updates.md"
          rows="$RUNNER_TEMP/buildpack-rows.md"
          : > "$rows"

          # catalog key -> registry repository
          map="paketo-nginx=paketobuildpacks/nginx
          paketo-procfile=paketobuildpacks/procfile
          paketo-health-checker=paketobuildpacks/health-checker
          paketo-builder-jammy-base=paketobuildpacks/builder-jammy-base
          paketo-builder-noble-java-tiny=paketobuildpacks/builder-noble-java-tiny"

          while IFS='=' read -r key repo; do
            [ -n "$key" ] || continue

            pinned="$(sed -n "s/^${key} = \"\\(.*\\)\".*/\\1/p" "$catalog" | head -n 1)"
            if [ -z "$pinned" ]; then
              echo "::warning::${key} is not in ${catalog}; the report skipped it"
              continue
            fi

            # A pin may hold one version back with `# hold-back: X.Y.Z`; the workflow stays quiet
            # about exactly that version and reports the next one, so a known-bad release does not
            # reopen the issue every week.
            held="$(sed -n "s/^${key} = .*# hold-back: \([0-9][0-9.]*\).*/\\1/p" "$catalog" | head -n 1)"

            # Only release tags (X.Y.Z): the registry also carries `latest`, `1` and `1.3`.
            # The jq program avoids a `$` anchor, so shellcheck sees no expansion inside quotes.
            latest="$(curl -fsS --retry 3 --retry-delay 2 \
              "https://hub.docker.com/v2/repositories/${repo}/tags?page_size=100" \
              | jq -r '[.results[].name
                  | select((split(".") | length) == 3)
                  | select((split(".") | map(tonumber? // empty) | length) == 3)]
                  | sort_by(split(".") | map(tonumber)) | last // empty')"

            if [ -z "$latest" ]; then
              echo "::warning::no release tag found for ${repo}"
              continue
            fi

            if [ -n "$held" ] && [ "$latest" = "$held" ]; then
              echo "::notice::${key} is held back at ${held}; not reporting it"
              continue
            fi

            # sort -V decides; a pin newer than the registry (a pre-release) is not an update.
            if [ "$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -n 1)" = "$pinned" ]; then
              continue
            fi

            printf "| \`%s\` | %s | **%s** | \`%s\` |\n" "$key" "$pinned" "$latest" "$repo" >> "$rows"
          done <<< "$map"

          if [ -s "$rows" ]; then
            {
              echo "The version catalog pins buildpacks and builders that Dependabot cannot see."
              echo
              echo "| Pin | Catalog | Latest | Image |"
              echo "| --- | ------- | ------ | ----- |"
              cat "$rows"
              echo
              echo "Bump the pins in \`gradle/libs.versions.toml\`, then prove them with"
              echo "\`./scripts/smoke-stack.sh\` — it builds all four images and checks the stack."
            } > "$body"
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "No buildpack updates available."
          fi

      - name: Open or update the buildpack updates issue
        if: steps.report.outputs.has_updates == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          title="Buildpack updates"
          existing="$(gh issue list --search "in:title \"$title\" is:issue is:open" \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/buildpack-updates.md"
            echo "Updated issue #$existing"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/buildpack-updates.md"
          fi
